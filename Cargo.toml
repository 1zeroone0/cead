[workspace]
members = ["."]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[package]
name = "cead"
version = "0.0.1"
edition = "2024"
description = "An agent harness built as a microVM. Name reserved; the first release is in progress."
repository = "https://github.com/1zeroone0/cead"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
